name: tests

on:
  push:
    branches:
      - main
      - feature/fair-acoustic-platform
      - fix/visible-fair-capabilities
      - feature/acoustic-research-object-profile
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile modules
        run: python -m compileall -q fair_platform dashboard app.py flask_app.py
      - name: Import research-object application
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import fair_platform; import dashboard.ui.research_builder; import dashboard.ui.research_enhanced_app"
      - name: Run full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Research-object export smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_research_object_profile.py::test_ro_crate_turtle_manifest_and_zip_are_consistent
      - name: Streamlit startup smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
          FAIR_PACKAGE_STORE: /tmp/fair-acoustic-packages
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8509 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8509/_stcore/health; then
              kill $APP_PID || true
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $APP_PID || true
          wait $APP_PID || true
          exit 1

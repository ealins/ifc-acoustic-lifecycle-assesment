name: tests

on:
  push:
    branches: [main, "thesis/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile modules
        run: python -m compileall -q vibro_ifc app.py
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Streamlit startup smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8509 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8509/_stcore/health; then
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill $APP_PID || true
          exit 1

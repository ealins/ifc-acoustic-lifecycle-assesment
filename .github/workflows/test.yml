name: tests

on:
  push:
    branches: [main, feature/fair-acoustic-platform]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile modules
        run: python -m compileall -q fair_platform dashboard app.py
      - name: Run tests
        run: pytest -q tests
